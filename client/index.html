      <h1>KelimeLink: Türkçe Kelime Bağlantı Bulmacası</h1>
      <p>KelimeLink, zekanızı ve kelime dağarcığınızı test eden bir Türkçe kelime oyunudur. Oyunun temel amacı, size verilen iki uzak kelime (örneğin "Güneş" ve "Kitap") arasında anlamsal bağlantılar kurarak bir yol oluşturmaktır. Her yeni kelime eklediğinizde, sistemimiz bu kelimenin mevcut kelimelerle olan anlamsal benzerliğini hesaplar.</p>
      <p>Eğer benzerlik belirli bir eşiğin üzerindeyse, kelimeler arasında bir bağ oluşur. Hedef kelimeye en kısa yoldan ulaşmaya çalışın. Bu oyun, yapay zeka ve doğal dil işleme (NLP) algoritmalarını kullanarak kelimeler arasındaki anlamsal ilişkileri tespit eder.</p>
      <h2>Oyun Modları</h2>
      <ul>
        <li><strong>Günlük Bulmaca:</strong> Her gün yeni bir kelime çifti ile kendinizi test edin.</li>
        <li><strong>Pratik Modu:</strong> Sınırsız rastgele kelime çifti ile antrenman yapın.</li>
        <li><strong>VS Modu:</strong> Arkadaşlarınızla aynı kelime çiftini en hızlı çözmek için gerçek zamanlı yarışın.</li>
      </ul>
      <h2>Nasıl Oynanır?</h2>
      <p>Başlangıç ve hedef kelimeyi inceleyin. İki kelimeyi birbirine bağlayacağını düşündüğünüz yeni kelimeler girin. Kelimeler arasında %26 ve üzeri benzerlik olduğunda bağlantı kurulur. Hedef kelimeye en az sayıda hamleyle ulaşmaya çalışın.</p>
      <p>Oynamak için lütfen JavaScript'i etkinleştirin.</p>
